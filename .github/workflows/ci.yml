name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Fake values so lib/db.ts and lib/auth.ts (which throw if these are
      # missing) can be imported during lint/test/build. No real database
      # or secret is ever contacted in CI.
      #
      # NODE_ENV is deliberately NOT set here: npm treats NODE_ENV=production
      # as "skip devDependencies", which would wipe out typescript, eslint,
      # and vitest before "npm ci" even runs. `next build` sets production
      # mode internally on its own, so nothing needs it set externally.
      MONGODB_URI: mongodb://localhost:27017/college-erp-ci
      JWT_SECRET: ci-only-placeholder-secret-never-used-in-production
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24  # match local dev (npm 11) so package-lock.json stays in sync
          cache: npm

      # Node 20 ships npm 10, which rejects lockfiles written by npm 11 (it wants entries
      # for optional peer packages that npm 11 leaves out). npm 11 accepts lockfiles from
      # either version, so CI no longer breaks depending on which npm last touched it.
      - name: Use npm 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
